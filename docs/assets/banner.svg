<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">LES: Living Engineering System</title>
  <desc id="desc">Three stacked layers beside the name LES and the line: a provider-neutral engineering methodology for human-directed AI delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f3a3a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g transform="translate(88 78)">
    <rect x="0" y="0" width="164" height="40" rx="12" fill="#2dd4bf"/>
    <rect x="22" y="58" width="164" height="40" rx="12" fill="#38bdf8"/>
    <rect x="44" y="116" width="164" height="40" rx="12" fill="#a3e635"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f8fafc">
    <text x="320" y="152" font-size="104" font-weight="800" letter-spacing="2">LES</text>
    <text x="324" y="196" font-size="32" font-weight="600" fill="#5eead4">Living Engineering System</text>
    <text x="324" y="240" font-size="22" fill="#cbd5e1">A provider-neutral engineering methodology for human-directed AI delivery.</text>
  </g>
</svg>
